name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: sample run (dry-run and real)
        run: |
          python samples/make_samples.py
          office-replace samples/input --rules samples/rules.xlsx -r --dry-run
          office-replace samples/input --rules samples/rules.csv -r -o "$RUNNER_TEMP/out"
          ls -R "$RUNNER_TEMP/out"
