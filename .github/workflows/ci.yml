name: ci

on:
  pull_request:
  push:
    branches: [main]
  # deps-lock が GITHUB_TOKEN で入れた constraints.txt のコミットでは CI が動かないので、手でも回せるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: .github/scripts/run.sh bash -c "ruff check . && ruff format --check ."
      - run: .github/scripts/run.sh pytest -q
      - name: sample run (dry-run and real)
        run: |
          .github/scripts/run.sh python samples/make_samples.py
          .github/scripts/run.sh office-replace samples/input --rules samples/rules.xlsx -r --dry-run
          .github/scripts/run.sh office-replace samples/input --rules samples/rules.csv -r -o "$RUNNER_TEMP/out"
          ls -R "$RUNNER_TEMP/out" "$RUNNER_TEMP/out_report"

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        shell: bash
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: bash .github/scripts/run.sh pytest -q
      - name: sample run
        shell: bash
        run: |
          bash .github/scripts/run.sh python samples/make_samples.py
          bash .github/scripts/run.sh office-replace samples/input --rules samples/rules.csv -r -o "$RUNNER_TEMP/out"

  # 置換後のファイルが LibreOffice で開けるか（壊れた XML・食い違ったテーブル定義などを検出する）
  libreoffice:
    name: LibreOffice で開けるか
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: LibreOffice と日本語フォントを入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress fonts-noto-cjk
      - name: 依存を入れる
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - name: サンプルを置換して、headless で PDF に変換する
        run: |
          python samples/make_samples.py
          .github/scripts/run.sh office-replace samples/input --rules samples/rules.xlsx -r -o "$RUNNER_TEMP/out"
          .github/scripts/run.sh python .github/scripts/check_libreoffice.py "$RUNNER_TEMP/out" "$RUNNER_TEMP/lo"

  security:
    name: security (bandit・pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存をハッシュを確かめて入れる（requirements-hashes.txt）
        run: |
          pip install --require-hashes -r requirements-hashes.txt
          # 本体と devtools-common（pyproject.toml の SHA で固定）は依存を引かずに入れ、足りない依存が無いかを pip check で確かめる
          pip install --no-deps -e . "$(grep -o 'devtools-common @ git+[^"]*' pyproject.toml)"
          pip check
      - name: ツールを入れる（版は固定）
        run: pip install "bandit==1.8.6" "pip-audit==2.9.0"
      - name: SAST（bandit. 中以上）
        run: .github/scripts/run.sh bandit -q -r src -ll
      - name: 依存の脆弱性（pip-audit）
        run: .github/scripts/run.sh pip-audit --skip-editable --progress-spinner off
