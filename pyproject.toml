[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-replace"
version = "0.1.0"
description = "Excel / Word / PowerPoint の文字列・図形・シート名・ファイル名をワイルドカードで一括置換する（元ファイルは書き換えない）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@a10e6e9c925ca31d3164d6b99bd753fad4399327",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# テストとサンプル生成で、置換後のファイルを各ライブラリで開いて確かめる
dev = ["pytest>=8", "ruff>=0.6", "python-docx>=1.1", "python-pptx>=1.0"]

[project.scripts]
office-replace = "office_replace.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 170

[tool.pytest.ini_options]
testpaths = ["tests"]
